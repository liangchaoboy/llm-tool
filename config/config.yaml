api:
  base_url: "https://api.openai.com/v1/chat/completions"  # 替换为实际的API端点
  api_key: "your-api-key-here"                            # 真实 key 请写到 config/config.local.yaml
  model: "gpt-3.5-turbo"                                  # 占位值；实际 model 来自测试用例中每条请求的 model 字段
  timeout: 10m                                            # 单次请求超时（HTTP round-trip，含流式读取完成）
  retry_count: 0                                          # 基准测试建议 0：重试会掩盖真实延迟与失败率
  retry_delay: 1s
  headers:
    User-Agent: "LLM-Test-Tool/1.0"

test:
  performance:
    concurrency: 10             # 并发 worker 数；CLI -concurrency 会覆盖此值
    requests_per_worker: 100    # 每个 worker 串行发出的请求数；CLI -requests-per-worker 会覆盖此值
    test_case_file: ""          # 测试用例 JSON 文件路径；CLI -test-case-file 会覆盖此值
